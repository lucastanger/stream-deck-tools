name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify tag matches package version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error('Tag must match package.json version');
          JS
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/*.streamDeckPlugin
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Verify artifact checksum
        working-directory: dist
        run: sha256sum --check com.local.teamsmic.streamDeckPlugin.sha256
      - name: Create draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --generate-notes \
            --title "Teams Controls $RELEASE_TAG" \
            dist/com.local.teamsmic.streamDeckPlugin \
            dist/com.local.teamsmic.streamDeckPlugin.sha256
